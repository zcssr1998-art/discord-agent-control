name: CI

# P2.2F: minimal, secret-free CI. Windows is the required job
# because Jarvis is Windows-first. Linux is a cheap portability signal only.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  linux-portability:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
